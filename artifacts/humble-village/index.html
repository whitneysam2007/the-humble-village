<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1" />
    <title>The Humble Village</title>
    <meta name="description" content="The Humble Village is a 501(c)(3) nonprofit empowering Q'eqchi' Mayan families in Guatemala with nutrition, education, healthcare, and self-reliance." />
    <meta name="robots" content="index, follow" />
    <meta property="og:title" content="The Humble Village" />
    <meta property="og:description" content="Empower a Mother. Transform a Village. 100% of donations go directly to projects in Guatemala." />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="The Humble Village" />
    <meta name="twitter:description" content="Empower a Mother. Transform a Village. 100% of donations go directly to projects in Guatemala." />
    <link rel="icon" type="image/webp" href="/favicon.webp" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>

    <!-- Hidden Netlify form stubs for SPA detection -->
    <form name="contact" data-netlify="true" netlify-honeypot="bot-field" hidden>
      <input type="hidden" name="form-name" value="contact" />
      <input name="bot-field" />
      <input name="first-name" />
      <input name="last-name" />
      <input name="email" />
      <input name="topic" />
      <textarea name="message"></textarea>
    </form>
    <form name="newsletter" data-netlify="true" netlify-honeypot="bot-field" hidden>
      <input type="hidden" name="form-name" value="newsletter" />
      <input name="bot-field" />
      <input name="email" />
    </form>
    <form name="asset-giving" data-netlify="true" netlify-honeypot="bot-field" hidden>
      <input type="hidden" name="form-name" value="asset-giving" />
      <input name="bot-field" />
      <input name="name" />
      <input name="email" />
      <textarea name="message"></textarea>
    </form>
    <form name="naru-circle" data-netlify="true" netlify-honeypot="bot-field" hidden>
      <input type="hidden" name="form-name" value="naru-circle" />
      <input name="bot-field" />
      <input name="name" />
      <input name="email" />
      <input name="program" />
      <textarea name="message"></textarea>
    </form>
  </body>
</html>
