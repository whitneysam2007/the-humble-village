kind = "web"
previewPath = "/"
title = "The Humble Village"
version = "1.0.0"
id = "artifacts/humble-village"
router = "path"

[[integratedSkills]]
name = "react-vite"
version = "1.0.0"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 19183

[services.development]
run = "pnpm --filter @workspace/humble-village run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/humble-village", "run", "build" ]
publicDir = "artifacts/humble-village/dist/public"
serve = "static"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "19183"
BASE_PATH = "/"
